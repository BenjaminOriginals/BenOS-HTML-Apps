<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy V5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --ink: #1d0b26;
        --glass: rgba(14, 18, 46, .6);
        --glass-hi: rgba(255, 255, 255, .15);
        --text: #f7f8ff;
        --muted: #bcc3e8;
        --gold: #ffc93c;
        --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
        --ui: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --outline: 0 .06em 0 var(--ink), .05em 0 0 var(--ink), -.05em 0 0 var(--ink), 0 -.05em 0 var(--ink),
                   .04em .04em 0 var(--ink), -.04em .04em 0 var(--ink), .04em -.04em 0 var(--ink), -.04em -.04em 0 var(--ink),
                   0 .14em .25em rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; width: 100%; height: 100%;
        background: #05060f; overflow: hidden;
        font-family: var(--ui);
        user-select: none; -webkit-user-select: none; touch-action: none;
    }
    body { display: flex; align-items: center; justify-content: center; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .display { font-family: var(--display); font-weight: 800; font-synthesis: none; }

    /* Game window. JS sets width / height / font-size so every "em" scales with the window. */
    #app { --mc: #4ade6b; position: relative; overflow: hidden; background: #000; font-size: 16px; color: var(--text); }
    #app.boxed { border-radius: .8em; box-shadow: 0 25px 50px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06); }
    #app.playing { cursor: none; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #fx { pointer-events: none; z-index: 35; }
    .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse 78% 72% at 50% 45%, transparent 52%, rgba(6,4,22,.45) 100%); transition: opacity .4s; }
    #app.no-vignette .vignette { opacity: 0; }

    .layer { position: absolute; inset: 0; transition: opacity .25s ease; pointer-events: none; }
    .layer.active { pointer-events: auto; }
    .hidden { opacity: 0; pointer-events: none !important; }

    kbd {
        font-family: var(--ui); font-weight: 700; font-size: .78em; line-height: 1;
        display: inline-block; padding: .32em .5em .26em; border-radius: .4em;
        background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); border-bottom-width: .2em;
        color: var(--text); vertical-align: middle; text-shadow: none;
    }

    /* ---------- 3D logo ---------- */
    .logo-stage { position: relative; perspective: 60em; perspective-origin: 50% 30%; display: flex; justify-content: center; align-items: center; }
    .logo3d {
        position: relative; display: flex; line-height: 1; letter-spacing: .035em; white-space: nowrap;
        transform-style: preserve-3d; animation: breathe 7.5s ease-in-out infinite;
    }
    .logo3d.display { font-family: 'Handlee', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', 'Chalkboard SE', cursive; letter-spacing: .02em; }
    .logo-main { padding-bottom: .22em; }
    .logo-main { font-size: 9.6em; }
    #app.narrow .logo-main { font-size: 6.4em; }
    .logo-crash { font-size: 6em; }
    #app.narrow .logo-crash { font-size: 5em; }
    .lt { position: relative; display: inline-block; transform-style: preserve-3d; animation: drop 1s cubic-bezier(.25,1.45,.45,1) both; animation-delay: calc(.15s + var(--i) * .085s); }
    .lt-in { position: relative; display: inline-block; transform-style: preserve-3d; animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.3s); }
    .ly { position: absolute; left: 0; top: 0; -webkit-text-stroke: .075em currentColor; transform: translate3d(0, calc(var(--k) * .0105em), calc(var(--k) * -.024em)); }
    .ly.ol { color: var(--ol, var(--ink)); -webkit-text-stroke: .075em var(--ol, var(--ink)); transform: translate3d(0, .004em, -.006em); }
    .face {
        position: relative; display: block; color: transparent;
        background-image: linear-gradient(104deg, transparent 40%, rgba(255,255,255,.95) 48.5%, rgba(255,255,255,.95) 51.5%, transparent 60%), var(--face);
        background-size: 300% 100%, 100% 100%; background-repeat: no-repeat; background-position: 100% 0, 0 0;
        -webkit-background-clip: text; background-clip: text;
        animation: shine 6.5s ease-in-out infinite; animation-delay: calc(2s + var(--i) * .07s);
    }
    .logo-main { --ol: #ffe23d; --face: linear-gradient(180deg, #e4ff8f 0%, #a6ff2e 34%, #72ec00 62%, #45cc00 100%); }
    .logo-crash { --ol: #ffe23d; --face: linear-gradient(180deg, #ffffff 0%, #ffd6de 32%, #ff6b7d 60%, #d61f43 100%); }
    @keyframes breathe {
        0%, 100% { transform: rotateX(18deg) rotateY(-17deg) rotateZ(-1.5deg) translate3d(0, 0, 0) scale(1); }
        50%      { transform: rotateX(5deg) rotateY(17deg) rotateZ(1.5deg) translate3d(0, -.05em, .45em) scale(1.045); }
    }
    @keyframes drop {
        0%   { transform: translate3d(0, -1.5em, 0) rotateX(-75deg); opacity: 0; }
        35%  { opacity: 1; }
        100% { transform: none; opacity: 1; }
    }
    @keyframes bob {
        0%, 100% { transform: translate3d(0, .025em, 0) rotateZ(-1.2deg); }
        50%      { transform: translate3d(0, -.035em, .06em) rotateZ(1.2deg); }
    }
    @keyframes shine { 0%, 68% { background-position: 100% 0, 0 0; } 100% { background-position: 0% 0, 0 0; } }
    .logo-glow {
        position: absolute; left: 50%; top: 50%; width: 36em; height: 17em; margin: -8.5em 0 0 -18em;
        background: radial-gradient(closest-side, rgba(200,255,80,.45), rgba(120,230,40,.15) 55%, transparent);
        animation: glow 7.5s ease-in-out infinite; pointer-events: none; mix-blend-mode: screen;
    }
    .logo-glow.crash { width: 26em; height: 12em; margin: -6em 0 0 -13em; background: radial-gradient(closest-side, rgba(255,80,110,.5), rgba(200,30,70,.15) 55%, transparent); }
    @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.1); } }

    /* ---------- Title screen ---------- */
    #start-screen { z-index: 20; }
    .scrim {
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse 70% 55% at 50% 32%, rgba(8,10,35,0) 0%, rgba(8,10,35,.22) 62%, rgba(6,7,26,.55) 100%),
            linear-gradient(180deg, rgba(6,7,26,0) 50%, rgba(6,7,26,.55) 100%);
    }
    .rays {
        position: absolute; left: var(--sunx, 100%); top: var(--suny, 0%);
        width: 150em; height: 150em; margin: -75em 0 0 -75em; pointer-events: none;
        background: repeating-conic-gradient(from 0deg, transparent 0deg 6deg, var(--ray, rgba(255,236,170,.16)) 8deg 11deg, transparent 13deg 20deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 22%, transparent 52%);
        mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 22%, transparent 52%);
        animation: spin 160s linear infinite; mix-blend-mode: screen;
    }
    #app.no-ambient .rays { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .menu {
        position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 2.5em 1em 4.6em;
        transform: translateY(var(--lift, 0px)); transition: transform .9s cubic-bezier(.2,.8,.2,1);
    }
    .hero { position: relative; }
    .press {
        position: absolute; left: -10em; right: -10em; top: calc(100% + 1.6em); text-align: center;
        font-size: 1.7em; color: #fff; text-shadow: var(--outline);
        animation: pressPulse 1.7s ease-in-out infinite; transition: opacity .3s;
    }
    #start-screen.stage-main .press { opacity: 0; animation: none; }
    @keyframes pressPulse { 0%, 100% { opacity: .55; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
    .tagline { margin: 1.3em 0 1.9em; font-size: 1.05em; font-weight: 500; color: rgba(255,255,255,.94); text-shadow: 0 .1em .7em rgba(0,0,0,.55); text-align: center; }

    .reveal { transition: opacity .45s ease, transform .6s cubic-bezier(.2,.9,.25,1); transition-delay: calc(var(--d, 0) * 90ms + 150ms); }
    #start-screen.stage-press .reveal { opacity: 0; transform: translateY(1.6em); pointer-events: none; transition-delay: 0s; }

    .modes { display: flex; align-items: center; gap: .8em; }
    .mode-row { display: flex; gap: .75em; }
    .mode {
        --mc: #fff; position: relative; width: 9.4em; padding: .95em .95em .85em; text-align: left;
        border-radius: .9em; background: var(--glass); border: 1px solid var(--glass-hi);
        backdrop-filter: blur(.7em) saturate(1.2); -webkit-backdrop-filter: blur(.7em) saturate(1.2);
        display: flex; flex-direction: column; gap: .45em; outline: none;
        box-shadow: 0 .6em 1.6em rgba(0,0,0,.28);
        transition: transform .28s cubic-bezier(.2,.9,.3,1.25), border-color .2s, box-shadow .25s, background .2s;
    }
    .mode:hover { transform: translateY(-.2em); border-color: rgba(255,255,255,.32); }
    .mode.on {
        transform: translateY(-.55em) scale(1.06);
        background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 28%, rgba(14,18,46,.8)), rgba(14,18,46,.74));
        border-color: var(--mc);
        box-shadow: 0 0 0 1px var(--mc), 0 1em 2.2em rgba(0,0,0,.42), 0 0 2.4em color-mix(in srgb, var(--mc) 45%, transparent);
    }
    .mode:focus-visible { box-shadow: 0 0 0 3px #fff; }
    .pips { display: flex; gap: .22em; }
    .pips i { width: .95em; height: .32em; border-radius: .2em; background: rgba(255,255,255,.16); }
    .pips i.on { background: var(--mc); box-shadow: 0 0 .5em color-mix(in srgb, var(--mc) 60%, transparent); }
    .m-name { font-size: 1.55em; line-height: 1; }
    .m-desc { font-size: .72em; color: var(--muted); line-height: 1.35; min-height: 4.05em; }
    .m-stats { display: grid; gap: .34em; }
    .st { display: grid; grid-template-columns: 6.6em 1fr; align-items: center; font-size: .64em; color: var(--muted); }
    .st b { height: .5em; border-radius: .3em; background: rgba(255,255,255,.12); position: relative; overflow: hidden; }
    .st b::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--mc); border-radius: inherit; }
    .m-best { display: flex; justify-content: space-between; align-items: baseline; font-size: .78em; color: var(--muted); border-top: 1px solid rgba(255,255,255,.1); padding-top: .5em; margin-top: .1em; }
    .m-best strong { font-family: var(--display); font-weight: 800; font-synthesis: none; font-size: 1.55em; color: var(--text); }
    .arrow {
        width: 2.4em; height: 2.4em; border-radius: 50%; border: 1px solid var(--glass-hi); background: var(--glass);
        backdrop-filter: blur(.5em); -webkit-backdrop-filter: blur(.5em);
        display: none; place-items: center; padding: 0; color: #fff; transition: transform .12s, background .12s;
    }
    .arrow svg { width: 55%; height: 55%; fill: currentColor; }
    .arrow:hover { transform: scale(1.1); background: rgba(30,36,80,.75); }
    #app.narrow .arrow { display: grid; }
    #app.narrow .mode:not(.on) { display: none; }
    #app.narrow .mode.on { width: 14em; transform: none; }

    .play-wrap { margin-top: 1.8em; }
    .play, .ghost {
        position: relative; display: inline-flex; align-items: center; gap: .65em;
        font-size: 2em; line-height: 1; padding: .42em .85em .42em 1.05em; border-radius: .45em; overflow: hidden;
        transition: transform .12s, filter .12s, box-shadow .12s; outline: none;
    }
    .play {
        border: none; color: #fff; text-shadow: var(--outline);
        background: linear-gradient(180deg, color-mix(in srgb, var(--mc) 62%, white) 0%, var(--mc) 52%, color-mix(in srgb, var(--mc) 78%, black) 100%);
        box-shadow: inset 0 .08em 0 rgba(255,255,255,.55), inset 0 -.1em 0 rgba(0,0,0,.18),
                    0 .16em 0 color-mix(in srgb, var(--mc) 45%, black), 0 .5em 1.2em rgba(0,0,0,.35),
                    0 0 1.5em color-mix(in srgb, var(--mc) 40%, transparent);
    }
    .play::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.5) 50%, transparent 65%);
        transform: translateX(-120%); animation: sheen 3.4s ease-in-out infinite;
    }
    @keyframes sheen { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    .play:hover, .ghost:hover { transform: translateY(-.05em) scale(1.03); filter: brightness(1.07); }
    .play:active { transform: translateY(.1em); box-shadow: inset 0 .08em 0 rgba(255,255,255,.4), 0 .05em 0 color-mix(in srgb, var(--mc) 45%, black), 0 .3em .8em rgba(0,0,0,.3); }
    .play:focus-visible, .ghost:focus-visible { box-shadow: 0 0 0 3px #fff; }
    .play kbd, .ghost kbd { font-size: .38em; background: rgba(0,0,0,.24); border-color: rgba(255,255,255,.35); }
    .ghost { color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.32); text-shadow: 0 .06em .2em rgba(0,0,0,.4); backdrop-filter: blur(.4em); -webkit-backdrop-filter: blur(.4em); }

    .recent { margin-top: 1.5em; display: flex; align-items: center; gap: .45em; font-size: .85em; color: rgba(255,255,255,.85); min-height: 2.1em; flex-wrap: wrap; justify-content: center; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
    .recent-label { margin-right: .3em; }
    .chip {
        --mc: #fff; display: inline-flex; align-items: center; gap: .45em; padding: .3em .75em .3em .6em; border-radius: 2em;
        background: var(--glass); border: 1px solid var(--glass-hi); color: var(--text); font-weight: 700; text-shadow: none;
        backdrop-filter: blur(.5em); -webkit-backdrop-filter: blur(.5em);
    }
    .chip::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--mc); box-shadow: 0 0 .5em var(--mc); }
    .hints {
        position: absolute; left: 0; right: 0; bottom: 1.4em; display: flex; justify-content: center; flex-wrap: wrap;
        gap: .5em 1.7em; font-size: .78em; color: rgba(255,255,255,.82); text-shadow: 0 1px 6px rgba(0,0,0,.6); padding: 0 1em;
    }
    .hints span { display: inline-flex; align-items: center; gap: .35em; }

    /* ---------- In-run overlays ---------- */
    #ready { position: absolute; left: 0; right: 0; top: 30%; z-index: 12; display: flex; flex-direction: column; align-items: center; gap: .8em; pointer-events: none; transition: opacity .3s, transform .4s; }
    #ready.hidden { transform: translateY(-1.2em); }
    .ready-title { font-size: 3.6em; color: #fff; text-shadow: var(--outline); }
    #ready.show .ready-title { animation: readyIn .6s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes readyIn { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .ready-sub { display: flex; align-items: center; gap: .7em; font-size: 1em; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
    .ready-sub kbd { background: rgba(15,18,46,.7); border-color: rgba(255,255,255,.35); }
    .mode-chip { font-size: 1.1em; padding: .22em .65em .26em; border-radius: .4em; background: var(--mc); color: #fff; text-shadow: var(--outline); box-shadow: 0 .15em 0 color-mix(in srgb, var(--mc) 50%, black); }

    #banner { position: absolute; left: 0; right: 0; top: 29%; height: 5.4em; z-index: 14; pointer-events: none; display: flex; align-items: center; justify-content: center; opacity: 0; }
    #banner.go { animation: bannerBand 1.8s ease both; }
    #banner::before {
        content: ""; position: absolute; inset: .7em -5%; transform: skewY(-2.5deg);
        background: linear-gradient(90deg, transparent, rgba(10,12,40,.55) 18%, rgba(10,12,40,.55) 82%, transparent);
        border-top: 2px solid var(--mc); border-bottom: 2px solid var(--mc);
    }
    .b-inner { position: relative; display: flex; align-items: baseline; gap: .55em; }
    .b-title { font-size: 2.8em; color: #ffd84a; text-shadow: var(--outline); }
    .b-sub { font-size: 1.45em; color: #fff; text-shadow: var(--outline); }
    @keyframes bannerBand {
        0%   { opacity: 0; transform: translateX(-30%) skewX(-14deg); }
        14%  { opacity: 1; transform: translateX(0) skewX(0); }
        78%  { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(25%) skewX(10deg); }
    }

    /* ---------- Results ---------- */
    #game-over-screen {
        z-index: 20; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, rgba(24,8,34,.32), rgba(8,4,18,.78));
        backdrop-filter: blur(.35em) saturate(.55); -webkit-backdrop-filter: blur(.35em) saturate(.55);
    }
    .over-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; padding: 1em; }
    .result {
        position: relative; margin-top: 1.5em; width: min(27em, 92%);
        display: grid; grid-template-columns: auto 1fr; gap: 1em 1.7em; padding: 1.45em 1.7em 1.2em;
        border-radius: 1em; background: var(--glass); border: 1px solid var(--glass-hi);
        backdrop-filter: blur(.8em); -webkit-backdrop-filter: blur(.8em); box-shadow: 0 1.2em 3em rgba(0,0,0,.45);
    }
    .result.in { animation: cardIn .6s cubic-bezier(.2,1.2,.3,1) both; animation-delay: .2s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(1.5em) scale(.94); } to { opacity: 1; transform: none; } }
    .medal-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em; }
    .medal {
        width: 5em; height: 5em; border-radius: 50%; display: grid; place-items: center; position: relative; overflow: hidden;
        color: rgba(0,0,0,.3);
        box-shadow: inset 0 0 0 .28em rgba(255,255,255,.35), inset 0 -.3em .6em rgba(0,0,0,.3), 0 .35em 1em rgba(0,0,0,.4);
    }
    .medal span { font-size: 2.3em; line-height: 1; }
    .medal::after {
        content: ""; position: absolute; inset: -20%; pointer-events: none;
        background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.65) 50%, transparent 60%);
        transform: translateX(-100%); animation: medalShine 3s ease-in-out infinite 1s;
    }
    @keyframes medalShine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .medal.none { background: rgba(255,255,255,.04); border: 2px dashed rgba(255,255,255,.22); box-shadow: none; color: rgba(255,255,255,.22); }
    .medal.none::after { display: none; }
    .medal.bronze { background: radial-gradient(circle at 35% 30%, #fde3c8, #cd7f32 55%, #7c4a1e); }
    .medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #cbd5e1 55%, #64748b); }
    .medal.gold { background: radial-gradient(circle at 35% 30%, #fffbe0, #facc15 55%, #a16207); }
    .medal.platinum { background: radial-gradient(circle at 35% 30%, #ffffff, #a5f3fc 50%, #6366f1); }
    .medal.stamp { animation: stamp .55s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes stamp { 0% { transform: scale(2.4) rotate(-25deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(0); } }
    .medal-label { font-size: 1.05em; min-height: 1.2em; }
    .score-col { display: flex; flex-direction: column; justify-content: center; }
    .score-row { display: flex; justify-content: space-between; align-items: center; padding: .25em 0; }
    .score-row + .score-row { border-top: 1px solid rgba(255,255,255,.1); }
    .score-label { color: var(--muted); font-weight: 600; font-size: .95em; }
    .score-value { font-size: 2.7em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .score-value.best { color: var(--gold); font-size: 2em; }
    .score-value.bump { animation: bump .45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes bump { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
    .run-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: .4em; padding-top: .9em; border-top: 1px solid rgba(255,255,255,.1); text-align: center; }
    .run-stats b { display: block; font-family: var(--display); font-weight: 800; font-synthesis: none; font-size: 1.35em; }
    .run-stats span { font-size: .72em; color: var(--muted); }
    .ribbon {
        position: absolute; top: -1em; right: 1.2em; font-size: 1.15em; padding: .3em .8em .34em;
        background: linear-gradient(180deg, #ffe066, #ffb200); color: #fff; text-shadow: var(--outline); border-radius: .4em;
        box-shadow: 0 .2em 0 #b86e00, 0 .4em 1em rgba(0,0,0,.35); opacity: 0; transform: rotate(4deg) scale(0);
    }
    .ribbon.show { animation: stampRibbon .5s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes stampRibbon { from { transform: rotate(-10deg) scale(2.2); opacity: 0; } to { transform: rotate(4deg) scale(1); opacity: 1; } }
    .over-actions { display: flex; gap: .9em; margin-top: 1.6em; flex-wrap: wrap; justify-content: center; }
    .over-actions .play, .over-actions .ghost { font-size: 1.6em; }
    .next-medal { margin-top: 1.1em; font-size: .9em; color: rgba(255,255,255,.8); min-height: 1.3em; text-shadow: 0 1px 6px rgba(0,0,0,.5); }

    /* ---------- Corner buttons ---------- */
    .chrome { position: absolute; top: .8em; z-index: 40; display: flex; gap: .5em; }
    .chrome.left { left: .8em; }
    .chrome.right { right: .8em; }
    .icon-btn {

<script>
(() => {

const DIFF_KEYS = Object.keys(DIFFICULTY);
const BEST_KEYS = { chill: 'flappyV5Best_chill', normal: 'avianDesktopHighScore', skilled: 'flappyV5Best_skilled', hard: 'flappyV5Best_hard', extreme: 'flappyV5Best_extreme' };

}
function mixHex(a, b, t) {

} catch (e) {}

if (!THEMES[settings.theme]) settings.theme = 'day';

const setBest = (d, v) => store.set(BEST_KEYS[d], String(v));

/* ================================================================== *
 *  DOM
 * ================================================================== */
const $ = id => document.getElementById(id);
const app = $('app'), canvas = $('gameCanvas'), fxCanvas = $('fx');

const fx = fxCanvas.getContext('2d');
const uiStart = $('start-screen'), uiOver = $('game-over-screen'), uiSettings = $('settings'), uiReady = $('ready');

const fader = $('fader'), banner = $('banner');
const fsBtn = $('fs-btn'), settingsBtn = $('settings-btn');
const ICON_FS = '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
const ICON_FS_EXIT = '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>';
fsBtn.innerHTML = ICON_FS;

/* ================================================================== *
 *  State
 * ================================================================== */
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 3, READY: 4 };
let state = STATE.MENU, menuStage = 'press';
let settingsOpen = false, transitioning = false;

let WORLD_W = 450, pxScale = 1, dpr = 1, fontPx = 16;
let score = 0, level = 1, flaps = 0, scorePop = 0;
let runDiff = settings.difficulty, runBest = 0;
let recentScores = [];
try { recentScores = JSON.parse(store.get('avianDesktopRecentScores')) || []; } catch (e) {}
let gameOverTime = 0, readyTime = 0, freeze = 0, timeScale = 1;
let trauma = 0, zoomPulse = 0, speedBurst = 0, flashAlpha = 0;
let lavaT = 0, tNow = 0, simT = 0, demoTimer = 0;
let pipeSpeed = 240, pipeGap = 220, diff = DIFFICULTY[settings.difficulty], lastTop = null;
let bird = null, pipes = [], particles = [], clouds = [], stars = [], embers = [], lines = [], rings = [], floaters = [], trail = [], confetti = [];
let fxDirty = false, countUp = null, lastCountTick = 0;
let lastT = performance.now(), acc = 0, fps = 60;
let displayFontReady = false;

const ranges = [
    { far: true,  list: [], par: 0.06, w: [220, 140], h: [140, 110], over: [0.35, 0.35] },
    { far: false, list: [], par: 0.15, w: [160, 120], h: [250, 200], over: [0.40, 0.40] }
];
const birdX = () => Math.min(WORLD_W * 0.28, 280);
const dfont = px => displayFontReady ? `${px}px 'Lilita One'` : `900 ${px}px system-ui, sans-serif`;
const UI_FONT = 'Rubik, system-ui, sans-serif';

/* ================================================================== *
 *  Audio: separate SFX and music buses, all synthesised
 * ================================================================== */
let actx = null, master = null, sfxBus = null, noiseBuf = null;
function ensureAudio() {
    if (!actx) {
        try {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            master = actx.createGain(); master.connect(actx.destination);
            sfxBus = actx.createGain(); sfxBus.connect(master);
            noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            Music.init();
        } catch (e) { actx = null; return; }
    }
    if (actx.state === 'suspended') actx.resume();
    updateVolume();
    if (settings.music) Music.start();
}
function updateVolume() {
    if (!actx) return;
    const t = actx.currentTime;
    master.gain.setTargetAtTime(settings.muted ? 0 : 1, t, 0.03);
    sfxBus.gain.setTargetAtTime(settings.sound ? settings.volume : 0, t, 0.03);
    Music.setVolume(settings.music ? settings.musicVolume * 0.55 : 0);
}
function env(g, t, peak, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

/* Procedural soundtrack: pads + arpeggio on the menu; bass and drums join in as you level up */
const Music = (() => {
    const BPM = 104, S16 = 60 / BPM / 4;
    const PROG = [
        { bass: 41, notes: [53, 57, 60, 64] },   // Fmaj7
        { bass: 43, notes: [55, 59, 62, 67] },   // G
        { bass: 40, notes: [52, 55, 59, 62] },   // Em7
        { bass: 45, notes: [57, 60, 64, 67] }    // Am7
    ];
    const ARP = [0, 1, 2, 3, 2, 1, 3, 2];
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    let bus, filt, dly, timer = 0, next = 0, idx = 0, running = false, intensity = 0;

    function init() {
        bus = actx.createGain(); bus.gain.value = 0;
        filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 18000; filt.Q.value = 0.5;
        bus.connect(filt); filt.connect(master);
        dly = actx.createDelay(1.5); dly.delayTime.value = S16 * 3;
        const fb = actx.createGain(); fb.gain.value = 0.32;
        const wet = actx.createGain(); wet.gain.value = 0.28;
        dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(bus);
    }
    function pad(ch, t, dur) {
        const f = actx.createBiquadFilter(); f.type = 'lowpass';
        f.frequency.setValueAtTime(600, t); f.frequency.linearRampToValueAtTime(1150, t + dur * 0.5); f.frequency.linearRampToValueAtTime(700, t + dur);
        const g = actx.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 0.6);
        g.gain.setValueAtTime(0.045, t + dur - 0.4); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.35);
        f.connect(g); g.connect(bus);
        for (const n of ch.notes) for (const det of [-7, 7]) {
            const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mf(n); o.detune.value = det;
            o.connect(f); o.start(t); o.stop(t + dur + 0.4);
        }
    }
    function pluck(freq, t, vol) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        env(g, t, vol, 0.004, 0.3);
        o.connect(g); g.connect(bus); g.connect(dly);
        o.start(t); o.stop(t + 0.35);
    }
    function bass(freq, t, dur) {
        const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
        const g = actx.createGain(); env(g, t, 0.2, 0.01, dur);
        f.connect(g); g.connect(bus);
        for (const [type, mul] of [['sine', 1], ['triangle', 2]]) {
            const o = actx.createOscillator(); o.type = type; o.frequency.value = freq * mul;
            o.connect(f); o.start(t); o.stop(t + dur + 0.05);
        }
    }
    function kick(t) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
        env(g, t, 0.5, 0.003, 0.3);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.35);
    }
    function hit(t, type, freq, q, vol, dur) {
        const src = actx.createBufferSource(); src.buffer = noiseBuf;
        const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = actx.createGain(); env(g, t, vol, 0.002, dur);
        src.connect(f); f.connect(g); g.connect(bus);
        src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
    }
    function schedule(i, t) {
        const s = i % 16, ch = PROG[Math.floor(i / 16) % 4], I = intensity;
        if (s === 0) pad(ch, t, S16 * 16);
        const arpStep = I >= 4 ? 1 : 2;
        if (s % arpStep === 0) {
            const n = ch.notes[ARP[(s / arpStep) % ARP.length]] + 12 + (I >= 4 && s % 4 === 3 ? 12 : 0);
            pluck(mf(n), t, I >= 2 ? 0.065 : 0.045);
        }
        if (I >= 1 && (s === 0 || s === 8 || (I >= 2 && (s === 3 || s === 11)))) bass(mf(ch.bass), t, S16 * (I >= 2 ? 2.2 : 6));
        if (I >= 2) {
            if (s === 0 || s === 8 || (I >= 3 && (s === 4 || s === 12))) kick(t);
            if (s % 4 === 2) hit(t, 'highpass', 7500, 0.7, 0.05, 0.045);
        }
        if (I >= 3 && (s === 4 || s === 12)) hit(t, 'bandpass', 1400, 0.7, 0.16, 0.14);
        if (I >= 4 && s % 2 === 1) hit(t, 'highpass', 8000, 0.7, 0.025, 0.035);
    }
    function tick() {
        if (!running) return;
        const now = actx.currentTime;
        if (next < now - 0.05) next = now + 0.05;      // tab was asleep: skip ahead instead of bursting
        while (next < now + 0.15) { schedule(idx, next); next += S16; idx++; }
    }
    return {
        init,
        start() { if (running || !actx) return; running = true; next = actx.currentTime + 0.1; timer = setInterval(tick, 25); },
        stop() { running = false; clearInterval(timer); },
        setVolume(v) { if (bus) bus.gain.setTargetAtTime(v, actx.currentTime, 0.15); },
        setIntensity(n) { intensity = n; },
        muffle(on) { if (filt) filt.frequency.setTargetAtTime(on ? 480 : 18000, actx.currentTime, on ? 0.08 : 0.25); }
    };
})();

function layout() {
    const ww = window.innerWidth, wh = window.innerHeight, r = ww / wh;
    let w = ww, h = wh;
    if (r > MAX_ASPECT) w = wh * MAX_ASPECT;
    else if (r < MIN_ASPECT) h = ww / MIN_ASPECT;
    fontPx = Math.max(9, h / 50);
    app.style.width = w + 'px';
    app.style.height = h + 'px';
    app.style.fontSize = fontPx + 'px';
    app.classList.toggle('boxed', Math.abs(w - ww) > 1 || Math.abs(h - wh) > 1);
    app.classList.toggle('narrow', w / fontPx < 54);
    WORLD_W = WORLD_H * (w / h);
    dpr = settings.hiDpi ? Math.min(window.devicePixelRatio || 1, 3) : 1;
    for (const c of [canvas, fxCanvas]) {
        c.width = Math.max(1, Math.round(w * dpr));
        c.height = Math.max(1, Math.round(h * dpr));
    }
    pxScale = canvas.height / WORLD_H;

function newCloud() {
    return { x: Math.random() * WORLD_W, y: Math.random() * (WORLD_H * 0.4) + 20, scale: rand(0.6, 1), speed: rand(0.2, 0.7) };
}
function newMtn(r, x) { return { x, width: Math.random() * r.w[1] + r.w[0], height: Math.random() * r.h[1] + r.h[0] }; }
function extendRange(r) {
    if (!r.list.length) r.list.push(newMtn(r, -60));
    let last = r.list[r.list.length - 1];
    while (last.x < WORLD_W + 260) {
        last = newMtn(r, last.x + last.width * (Math.random() * r.over[1] + r.over[0]));
        r.list.push(last);
    }
}
function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random() * 0.65, s: rand(0.5, 1.9), p: Math.random() * 6.28 });
}
function newEmber(initial) {
    return { x: Math.random() * (WORLD_W + 100) - 50, y: initial ? rand(WORLD_H * 0.55, WORLD_H) : WORLD_H - rand(10, 40),
             vy: -rand(25, 70), sway: rand(10, 30), ph: Math.random() * 6.28, life: initial ? rand(0, 3) : 0, max: rand(3, 6.5), size: rand(1, 2.6) };
}
function fitScenery() {
    const want = Math.max(4, Math.round(WORLD_W / 170));
    while (clouds.length < want) clouds.push(newCloud());
    while (clouds.length > want) clouds.pop();
    clouds.sort((a, b) => a.scale - b.scale);          // far (small) clouds behind near ones
    ranges.forEach(extendRange);
    const wantE = Math.round(WORLD_W / 30);
    while (embers.length < wantE) embers.push(newEmber(true));
    while (embers.length > wantE) embers.pop();
}
function scrollSpeed() {
    if (state === STATE.PLAYING || (state === STATE.MENU && bird && !bird.dead)) return pipeSpeed;
    if (state === STATE.READY) return 70;
    return 0;
}
function updateScenery(dt) {
    const v = scrollSpeed();
    for (const c of clouds) {
        c.x -= c.speed * v * 0.2 * dt;
        if (c.x + 150 * c.scale < 0) { c.x = WORLD_W + 60 * c.scale; c.y = Math.random() * (WORLD_H * 0.4) + 20; }
    }
    if (v) for (const r of ranges) {
        for (const m of r.list) m.x -= v * r.par * dt;
        while (r.list.length > 1 && r.list[0].x + r.list[0].width < -60) r.list.shift();
        extendRange(r);
    }
    if (state !== STATE.GAMEOVER) lavaT += dt * 9;

    // embers drift up out of the lava
    for (const e of embers) {
        e.life += dt;
        e.y += e.vy * dt;
        e.x += Math.sin(e.ph + tNow * 1.4) * e.sway * dt - v * 0.12 * dt;
        if (e.life > e.max || e.y < WORLD_H * 0.45) Object.assign(e, newEmber(false));
        if (e.x < -60) e.x += WORLD_W + 100;
    }
    // speed lines once things get fast
    const live = state === STATE.PLAYING;
    const lineRate = live && settings.ambient ? clamp((level - 1) * 0.22, 0, 0.8) + speedBurst * 1.5 : 0;
    if (lineRate > 0 && Math.random() < lineRate * 26 * dt) {
        lines.push({ x: WORLD_W + 40, y: rand(60, WORLD_H - 120), len: rand(80, 220), v: pipeSpeed * rand(2, 3), a: rand(0.08, 0.2) });
    }
    for (let i = lines.length - 1; i >= 0; i--) {
        lines[i].x -= lines[i].v * dt;
        if (lines[i].x + lines[i].len < -20) lines.splice(i, 1);
    }
}

function newBird() {

function flapBird(silent) {

function spawnParticle(x, y, color, explosive) {

        x, y, color,
        size: Math.random() * 4 + 2,
        vx: explosive ? (Math.random() - .5) * 760 : ((Math.random() - .5) * 2 - 2) * 60,
        vy: explosive ? (Math.random() - .5) * 760 : (Math.random() - .5) * 120,

/* Gaps are random but always reachable: the next gap is never higher than the bird can climb in time. */
function newPipe(x) {
    const amp = Math.random() < diff.movers ? diff.amp : 0;
    const loBase = MIN_TOP + amp, hiBase = GROUND_Y - pipeGap - MIN_TOP - amp;
    let lo = loBase, hi = hiBase;
    if (lastTop !== null) {
        const travel = diff.spacing / pipeSpeed;
        const maxUp = clamp(CLIMB_RATE * travel * 0.85 + 40 - amp, 110, 320);
        lo = Math.max(lo, lastTop - maxUp);
        hi = Math.min(hi, lastTop + 320);
        if (lo > hi) lo = hi = clamp(lastTop, loBase, hiBase);
    }
    const top = Math.round(lo + Math.random() * (hi - lo));
    lastTop = top;
    return { x, prevX: x, baseTop: top, top, gap: pipeGap, bottom: top + pipeGap, passed: false,
             amp, phase: Math.random() * Math.PI * 2, freq: 1.5 + Math.random() * 0.9 };
}
function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
}

    const rad = h / 2;
    return circleHitsRect(cx, cy, r + rad, x + rad, y + rad, w - 2 * rad, 0);
}
function pipeHits(p, b) {
    const r = HIT_R, cx = b.x, cy = b.y;
    if (cx + r < p.x - CAP_OVERHANG || cx - r > p.x + PIPE_W + CAP_OVERHANG) return false;
    const capX = p.x - CAP_OVERHANG, capW = PIPE_W + CAP_OVERHANG * 2;
    return circleHitsRect(cx, cy, r, p.x, -200, PIPE_W, p.top - CAP_H / 2 + 200) ||
           circleHitsPill(cx, cy, r, capX, p.top - CAP_H, capW, CAP_H) ||
           circleHitsRect(cx, cy, r, p.x, p.bottom + CAP_H / 2, PIPE_W, WORLD_H) ||
           circleHitsPill(cx, cy, r, capX, p.bottom, capW, CAP_H);
}

/* Autopilot for the title-screen demo flight */
function botThink() {
    const b = bird;
    let next = null;
    for (const p of pipes) if (p.x + PIPE_W + CAP_OVERHANG > b.x - HIT_R) { next = p; break; }
    let target = WORLD_H * 0.45;
    if (next) {
        const inside = next.x - CAP_OVERHANG < b.x + HIT_R;
        const tReach = Math.max(0, (next.x - b.x) / pipeSpeed);
        const top = inside || !next.amp ? next.top : next.baseTop + Math.sin(next.phase + (simT + tReach) * next.freq) * next.amp;
        target = top + next.gap * 0.62;
        if (inside && b.y - HIT_R < next.top + 14) return;
    }
    if (b.y > target && b.vy > -40) flapBird(true);
}

            for (const tp of trail) tp.x -= pipeSpeed * dt;
            trail.push({ x: bird.x, y: by });
            if (trail.length > 10) trail.shift();
            const pal = birdPal(settings.birdColor);
            for (let i = 0; i < trail.length - 1; i++) {
                const k = i / trail.length;
                ctx.globalAlpha = k * 0.22;
                ctx.fillStyle = pal.base;
                ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, bird.r * (0.3 + 0.55 * k), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
        } else if (trail.length) trail = [];
        drawBird(by);
    }

    for (const f of floaters) {
        ctx.save();
        ctx.globalAlpha = 1 - f.t * f.t;
        ctx.font = dfont(f.gold ? 26 : 30);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
        ctx.lineWidth = 6; ctx.strokeStyle = '#1d0b26';
        const fy = f.y - 46 * easeOut(f.t);
        ctx.strokeText(f.text, f.x, fy);
        ctx.fillStyle = f.gold ? '#fde047' : '#ffffff';
        ctx.fillText(f.text, f.x, fy);
        ctx.restore();
    }

    if (lines.length) {
        ctx.lineCap = 'round'; ctx.lineWidth = 2.5;
        for (const l of lines) {
            const lg = ctx.createLinearGradient(l.x, 0, l.x + l.len, 0);
            lg.addColorStop(0, `rgba(255,255,255,${l.a})`); lg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.strokeStyle = lg;
            ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke();
        }
    }
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(-80, -80, WORLD_W + 160, WORLD_H + 160);
    }
    drawLava(th);

    // the HUD sits outside the camera so it never shakes
    ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
    drawHud();
    if (settings.showFps) {
        ctx.font = '600 14px ui-monospace, Consolas, monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        shadow('rgba(0,0,0,0.6)', 4, 1);
        ctx.fillText('FPS ' + Math.round(fps), 14, 78);
        noShadow();
    }
}

/* Confetti lives on its own canvas above the results card */
function launchConfetti() {
    if (!settings.particles) return;
    const cols = ['#ffd84a', '#ffffff', diff.color, '#ff6b9d', '#5ce1e6'];
    for (let i = 0; i < 110; i++) {
        confetti.push({
            x: WORLD_W / 2 + rand(-60, 60), y: WORLD_H * 0.42,
            vx: rand(-520, 520), vy: rand(-950, -320), rot: rand(0, 6.28), vr: rand(-10, 10),
            w: rand(7, 12), h: rand(10, 18), c: cols[i % cols.length], life: rand(1.8, 2.8)
        });
    }
}
function renderFx(dt) {
    if (!confetti.length && !fxDirty) return;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    fx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
    for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.vy += 1400 * dt; c.vx *= Math.pow(0.35, dt); c.vy *= Math.pow(0.6, dt);
        c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt;
        if (c.life <= 0 || c.y > WORLD_H + 40) { confetti.splice(i, 1); continue; }
        fx.save();
        fx.globalAlpha = Math.min(1, c.life * 2);
        fx.translate(c.x, c.y); fx.rotate(c.rot); fx.scale(1, Math.cos(c.rot * 1.7));
        fx.fillStyle = c.c; fx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        fx.restore();
    }
    fxDirty = confetti.length > 0;
}

/* ================================================================== *
 *  Main loop
 * ================================================================== */
function frame(t) {
    requestAnimationFrame(frame);
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    tNow += dt;
    if (dt > 0) fps = lerp(fps, 1 / dt, 0.05);

    if (freeze > 0) {
        freeze -= dt;
    } else {
        if (timeScale < 1) timeScale = Math.min(1, timeScale + dt * 0.9);
        acc += dt * timeScale;
        while (acc >= STEP) {
            step(STEP);
            acc -= STEP;
            if (freeze > 0) { acc = 0; break; }
        }
    }
    updateScenery(dt);

    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt / 0.45; if (rings[i].t >= 1) rings.splice(i, 1); }
    for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt / 0.8; if (floaters[i].t >= 1) floaters.splice(i, 1); }
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - 3 * dt);
    if (scorePop > 0) scorePop = Math.max(0, scorePop - dt * 6);
    if (trauma > 0) trauma = Math.max(0, trauma - dt * 1.3);
    if (zoomPulse > 0) zoomPulse = Math.max(0, zoomPulse - dt * 2.2);
    if (speedBurst > 0) speedBurst = Math.max(0, speedBurst - dt * 1.2);

    if (bird) {
        bird.stretch = Math.max(0, bird.stretch - dt * 6);
        bird.blinkIn -= dt;
        if (bird.blinkIn <= 0) { bird.blink = 0.12; bird.blinkIn = rand(2, 5); }
        if (bird.blink > 0) bird.blink -= dt;
        if (state === STATE.PLAYING || state === STATE.MENU) bird.wing = Math.max(0, bird.wing - dt * 4);
        if (state === STATE.READY) {
            bird.y = bird.prevY = WORLD_H * 0.5 + Math.sin(tNow * 4.8) * 8;
            bird.rot += (0 - bird.rot) * (1 - Math.exp(-7.7 * dt));
            bird.wing = 0.5 + 0.5 * Math.sin(tNow * 12);
        }
    }
    updateCountUp(performance.now());
    render(freeze > 0 ? 1 : acc / STEP, dt);
    renderFx(dt);
}

/* ================================================================== *
 *  Input
 * ================================================================== */
function action() {
    if (settingsOpen || transitioning) return;
    switch (state) {
        case STATE.READY:
            setState(STATE.PLAYING);
            hide(uiReady);
            flapBird();
            break;
        case STATE.PLAYING:
            flapBird();
            break;
        case STATE.GAMEOVER:
            if (performance.now() - gameOverTime >= RESTART_GUARD) startGame();
            break;
    }
}
function cycleMode(dir) {
    const i = DIFF_KEYS.indexOf(settings.difficulty);
    chooseDifficulty(DIFF_KEYS[(i + dir + DIFF_KEYS.length) % DIFF_KEYS.length]);
}

app.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    ensureAudio();
    if (e.target.closest('button, .panel, input, label, .chrome')) return;
    if (state === STATE.MENU) { if (menuStage === 'press') { setStage('main'); sfx.confirm(); } return; }
    action();
});
app.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
    if (settingsOpen) {
        if (e.code === 'Escape' || e.code === 'KeyS') { e.preventDefault(); closeSettings(); }
        return;
    }
    const flapKey = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
    if (flapKey || ['KeyR', 'Escape', 'KeyF', 'KeyM', 'KeyS', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowDown', 'KeyA', 'KeyD'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    ensureAudio();

    if (e.code === 'KeyF') { toggleFullscreen(); return; }
    if (e.code === 'KeyM') { set('muted', !settings.muted); syncControls(); return; }
    if (transitioning) return;

    if (state === STATE.MENU && menuStage === 'press') {
        if (/^(Tab|Shift|Control|Alt|Meta)/.test(e.code)) return;
        setStage('main'); sfx.confirm();
        return;
    }
    const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'].indexOf(e.code);
    if (n >= 0 && state !== STATE.PLAYING) { chooseDifficulty(DIFF_KEYS[n]); return; }

    const left = e.code === 'ArrowLeft' || e.code === 'KeyA', right = e.code === 'ArrowRight' || e.code === 'KeyD';
    switch (state) {
        case STATE.MENU:
            if (flapKey || e.code === 'Enter') startGame();
            else if (left) cycleMode(-1);
            else if (right) cycleMode(1);
            else if (e.code === 'KeyS') openSettings();
            break;
        case STATE.READY:
            if (flapKey) action();
            else if (e.code === 'Escape') returnToMenu();
            else if (e.code === 'KeyS') openSettings();
            break;
        case STATE.PLAYING:
            if (flapKey) action();
            break;
        case STATE.GAMEOVER:
            if (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter') action();
            else if (e.code === 'Escape') returnToMenu();
            else if (e.code === 'KeyS') openSettings();
            else if (left) cycleMode(-1);
            else if (right) cycleMode(1);
            break;
    }
});

const LOGO_MAIN = { ink: '#0b2a05', ext: ['#2f9e00', '#0e4d02'] };

/* Real 3D lettering: each letter is a stack of offset layers, so tilting the logo reveals its depth */
function build3D(el, text, scheme) {
    const depth = 14;
    el.innerHTML = '';
    el.setAttribute('aria-label', text);
    [...text].forEach((ch, i) => {
        const lt = document.createElement('span'); lt.className = 'lt'; lt.style.setProperty('--i', i); lt.setAttribute('aria-hidden', 'true');
        const inner = document.createElement('span'); inner.className = 'lt-in';
        for (let k = depth; k >= 1; k--) {
            const ly = document.createElement('span');
            ly.className = 'ly'; ly.textContent = ch; ly.style.setProperty('--k', k);
            ly.style.color = k >= depth - 1 ? scheme.ink : mixHex(scheme.ext[0], scheme.ext[1], (k - 1) / (depth - 3));
            if (k === depth) ly.style.textShadow = '0 .07em .16em rgba(0,0,0,.45)';
            inner.appendChild(ly);
        }
        const ol = document.createElement('span'); ol.className = 'ly ol'; ol.textContent = ch;
        const face = document.createElement('span'); face.className = 'face'; face.textContent = ch;
        inner.append(ol, face);
        lt.appendChild(inner);
        el.appendChild(lt);
    });
}

    if (menuStage !== 'press') { menuEl.style.setProperty('--lift', '0px'); return; }

function formatTime(ts) {
    const d = new Date(ts);
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${days[d.getDay()]} ${h}:${m} ${ap}`;
}

function mk(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function set(k, v) {
    settings[k] = v;

        updateVolume();

function syncControls() { syncers.forEach(f => f()); }

function buildControl(item) {
    const k = item.k;
    if (item.t === 'choice') {
        const seg = mk('div', 'seg');
        const btns = item.opts.map(([v, text]) => {
            const b = mk('button'); b.textContent = text;
            b.addEventListener('click', () => { if (k === 'difficulty') chooseDifficulty(v); else { set(k, v); syncControls(); } });
            seg.appendChild(b); return [v, b];
        });
        return { el: seg, sync: () => btns.forEach(([v, b]) => b.classList.toggle('on', settings[k] === v)) };
    }
    if (item.t === 'toggle') {
        const lab = mk('label', 'switch');
        const inp = mk('input'); inp.type = 'checkbox';
        inp.addEventListener('change', () => set(k, inp.checked));
        lab.append(inp, mk('span'));
        return { el: lab, sync: () => { inp.checked = !!settings[k]; } };
    }
    if (item.t === 'range') {
        const wrap = mk('div', 'range-wrap');
        const inp = mk('input'); inp.type = 'range'; inp.min = item.min; inp.max = item.max; inp.step = item.step;
        const out = mk('output');
        inp.addEventListener('input', () => { set(k, parseFloat(inp.value)); out.textContent = item.fmt(settings[k]); });
        wrap.append(inp, out);
        return { el: wrap, sync: () => { inp.value = settings[k]; out.textContent = item.fmt(settings[k]); } };
    }
    if (item.t === 'swatch') {
        const wrap = mk('div', 'sw-wrap');
        const btns = item.opts.map(([v, css]) => {
            const b = mk('button', 'sw'); b.style.background = css; b.title = String(v);
            b.addEventListener('click', () => { set(k, v); syncControls(); });
            wrap.appendChild(b); return [v, b];
        });
        let colorInp = null;
        if (item.custom) {
            colorInp = mk('input'); colorInp.type = 'color'; colorInp.title = 'Custom color';
            colorInp.addEventListener('input', () => { set(k, colorInp.value); btns.forEach(([v, b]) => b.classList.toggle('on', v === settings[k])); });
            wrap.appendChild(colorInp);
        }
        return { el: wrap, sync: () => {
            btns.forEach(([v, b]) => b.classList.toggle('on', v === settings[k]));
            if (colorInp && /^#[0-9a-f]{6}$/i.test(settings[k])) colorInp.value = settings[k];
        } };
    }
}

                    <span><kbd>Space</kbd> <kbd>Enter</kbd> <kbd>R</kbd></span><span>Play, or play again after a crash</span>
                    <span><kbd>Esc</kbd></span><span>Main menu (outside a run)</span>
                    <span><kbd>F</kbd></span><span>Fullscreen</span>
                    <span><kbd>M</kbd></span><span>Mute everything</span>
                    <span><kbd>S</kbd></span><span>Settings (outside a run)</span>
                </div>
                <h4>Data</h4>
                <div class="danger-row">
                    <button class="small-btn warn" id="reset-scores">Reset scores</button>
                    <button class="small-btn warn" id="reset-settings">Restore default settings</button>
                </div>`;
        }
        panes.appendChild(pane);
    });

    const confirmBtn = (id, label, fn) => {
        const b = $(id); let armed = false, timer = 0;
        b.addEventListener('click', () => {
            if (!armed) {
                armed = true; b.textContent = 'Click again to confirm';
                timer = setTimeout(() => { armed = false; b.textContent = label; }, 3000);
            } else { clearTimeout(timer); armed = false; b.textContent = label; fn(); }
        });
    };
    confirmBtn('reset-scores', 'Reset scores', () => {
        recentScores = [];
        Object.values(BEST_KEYS).forEach(k => store.del(k));
        store.del('avianDesktopRecentScores');
        runBest = 0;
        renderMenu();
    });
    confirmBtn('reset-settings', 'Restore default settings', () => {
        settings = Object.assign({}, DEFAULTS);
        saveSettings(); updateVolume(); applyThemeVars(); layout(); syncControls();
        if (actx) Music.start();
    });
    syncControls();
}
function openSettings() {
    if (settingsOpen || state === STATE.PLAYING) return;
    settingsOpen = true;
    show(uiSettings);
    syncControls();
}
function closeSettings() {
    if (!settingsOpen) return;
    settingsOpen = false;
    hide(uiSettings);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

/* ================================================================== *
 *  Boot
 * ================================================================== */
initStars();
build3D($('logo'), 'Flappy', LOGO_MAIN);
buildModes();
buildSettings();
applyThemeVars();
applyClasses();
menuEl.style.transition = 'none';          // no slide on first paint
layout();
resetDemo();
renderMenu();
setStage('press');
requestAnimationFrame(() => requestAnimationFrame(() => { menuEl.style.transition = ''; }));
if (document.fonts) {
    const check = () => { try { displayFontReady = document.fonts.check("40px 'Lilita One'"); } catch (e) {} updateLift(); };
    document.fonts.ready.then(check);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', check);
}
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
